#
# The analyzer's own build/test/coverage gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # A vet tool is installed on whatever machine runs CI, so it is built
      # for every architecture the fleet ships on, not only this runner's.
      - name: Cross-compile (all 6 64-bit Linux arches + darwin + windows)
        env:
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

      - name: Test with coverage
        run: |
          go test -covermode=set -coverprofile=cover.out ./...
          go tool cover -func=cover.out

      - name: Require 100% coverage of the analyzer package
        run: |
          pct=$(go test -covermode=set -coverprofile=pkg.out . >/dev/null && \
                go tool cover -func=pkg.out | awk '/^total:/ {print $3}')
          echo "analyzer package coverage: $pct"
          [ "$pct" = "100.0%" ] || { echo "coverage below 100%"; exit 1; }
